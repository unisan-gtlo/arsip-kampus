# Place at /etc/nginx/conf.d/arsip.unisan-g.id.conf on the VPS, then run
# `sudo certbot --nginx -d arsip.unisan-g.id` — certbot will rewrite this
# file in place to add the SSL block and HTTP->HTTPS redirect, exactly like
# every other *.conf in /etc/nginx/conf.d/ on this server.
#
# Static files are served by WhiteNoise inside gunicorn (see
# config/settings/base.py), so no /static/ alias is needed here, unlike
# sister.conf/akreditasi.conf which proxy Django apps that don't use it.

server {
    server_name arsip.unisan-g.id;

    client_max_body_size 25M;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 80;
}
